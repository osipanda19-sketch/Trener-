<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<link rel="manifest" href="manifest.webmanifest">
<title>Тренировки</title>
<style>
:root{--bg:#0b0c0f;--card:#15171c;--card2:#1c1f26;--text:#f5f6f8;--muted:#9298a5;--accent:#7c5cff;--green:#35d07f;--red:#ff5c70;--line:#292d36}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;padding-bottom:92px}
header{padding:calc(env(safe-area-inset-top) + 18px) 18px 14px;position:sticky;top:0;background:rgba(11,12,15,.92);backdrop-filter:blur(18px);z-index:4}
h1{font-size:30px;margin:0 0 5px}.sub{color:var(--muted);font-size:14px}
main{padding:8px 16px;max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
button,input,select{font:inherit}button{border:0;border-radius:14px;padding:13px 16px;background:var(--card2);color:var(--text);font-weight:700;cursor:pointer}button.primary{background:var(--accent)}button.green{background:var(--green);color:#07120c}button.danger{color:#ff8795}
input{width:100%;background:#0f1115;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border-radius:15px;padding:13px}.stat b{display:block;font-size:22px;margin-top:4px}.muted{color:var(--muted)}
.exercise{padding:15px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.ex-title{font-size:18px;font-weight:800;margin-bottom:10px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:7px;align-items:center;margin:7px 0}.setno{color:var(--muted);text-align:center}.set input{padding:10px}.done{background:var(--green);color:#07120c;padding:10px;border-radius:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,16,20,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}.nav button{flex:1;max-width:220px;background:transparent;color:var(--muted)}.nav button.active{color:#fff}
.timer{position:fixed;inset:auto 14px calc(82px + env(safe-area-inset-bottom)) 14px;background:#171922;border:1px solid #3a3d49;border-radius:22px;padding:16px;z-index:20;box-shadow:0 15px 50px #0008}.timer strong{font-size:32px}.hidden{display:none!important}
canvas{width:100%;height:190px;background:#0f1115;border-radius:16px}.pill{display:inline-block;padding:6px 10px;background:#242731;border-radius:99px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><h1 id="title">Тренировка</h1><div class="sub" id="subtitle">Записывай каждый подход — остальное приложение посчитает само.</div></header>
<main id="app"></main>
<div id="timer" class="timer hidden">
  <div class="row between"><div><div class="muted">Отдых</div><strong id="time">3:00</strong></div><button onclick="skipTimer()">Пропустить</button></div>
</div>
<nav class="nav"><button id="nTrain" class="active" onclick="showPage('train')">🏋️ Тренировка</button><button id="nHistory" onclick="showPage('history')">📈 Прогресс</button></nav>
<script>
const KEY='workout_tracker_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"workouts":[],"current":null}');
let timerId=null, remaining=180;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function showPage(p){$('nTrain').classList.toggle('active',p==='train');$('nHistory').classList.toggle('active',p==='history');p==='train'?renderTrain():renderHistory()}
function renderTrain(){
 $('title').textContent=data.current?'Текущая тренировка':'Тренировка';
 $('subtitle').textContent=data.current?new Date(data.current.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'Готов начать новую тренировку?';
 if(!data.current){$('app').innerHTML=`<div class="card"><h2>Начать тренировку</h2><p class="muted">Добавляй упражнения и записывай вес и повторения. Отдых после каждого выполненного подхода — 3 минуты.</p><button class="primary" onclick="startWorkout()">Начать</button></div><div class="card"><div class="grid"><div class="stat"><span class="muted">Тренировок</span><b>${data.workouts.length}</b></div><div class="stat"><span class="muted">Подходов</span><b>${data.workouts.reduce((a,w)=>a+w.exercises.reduce((x,e)=>x+e.sets.length,0),0)}</b></div></div></div>`;return}
let exHtml=data.current.exercises.map((e,ei)=>`<div class="exercise"><div class="row between"><div class="ex-title">${esc(e.name)}</div><button class="danger" onclick="removeExercise(${ei})">Удалить</button></div>
${e.sets.map((s,si)=>`<div class="set"><div class="setno">${si+1}</div><input type="number" step="0.5" placeholder="кг" value="${s.weight}" onchange="updSet(${ei},${si},'weight',this.value)"><input type="number" placeholder="повт." value="${s.reps}" onchange="updSet(${ei},${si},'reps',this.value)"><button class="${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'OK'}</button></div>`).join('')}
<button onclick="addSet(${ei})">＋ Добавить подход</button></div>`).join('');
$('app').innerHTML=`<div class="card"><div class="row"><input id="exName" placeholder="Название упражнения"><button class="primary" onclick="addExercise()">Добавить</button></div></div>
<div class="card">${exHtml||'<p class="muted">Добавь первое упражнение выше.</p>'}</div>
<div class="card"><div class="grid"><div class="stat"><span class="muted">Объём</span><b>${volume(data.current)} кг</b></div><div class="stat"><span class="muted">Подходов</span><b>${data.current.exercises.reduce((a,e)=>a+e.sets.length,0)}</b></div></div><button class="green" style="width:100%;margin-top:12px" onclick="finishWorkout()">Завершить тренировку</button></div>`;
}
function startWorkout(){data.current={date:new Date().toISOString(),exercises:[]};save();renderTrain()}
function addExercise(){let n=$('exName').value.trim();if(!n)return;data.current.exercises.push({name:n,sets:[{weight:'',reps:'',done:false}]});save();renderTrain()}
function removeExercise(i){data.current.exercises.splice(i,1);save();renderTrain()}
function addSet(i){data.current.exercises[i].sets.push({weight:'',reps:'',done:false});save();renderTrain()}
function updSet(e,s,k,v){data.current.exercises[e].sets[s][k]=v;save()}
function toggleSet(e,s){let x=data.current.exercises[e].sets[s];x.done=!x.done;save();renderTrain();if(x.done)startTimer()}
function volume(w){return Math.round(w.exercises.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+(Number(s.weight)||0)*(Number(s.reps)||0),0),0))}
function finishWorkout(){if(!data.current.exercises.length)return;if(!confirm('Сохранить тренировку?'))return;data.workouts.push(data.current);data.current=null;save();stopTimer();showPage('history')}
function startTimer(){remaining=180;$('timer').classList.remove('hidden');updateTimer();clearInterval(timerId);timerId=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timerId);navigator.vibrate?.([200,100,200]);$('time').textContent='Готово!'}},1000)}
function updateTimer(){$('time').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function skipTimer(){stopTimer()} function stopTimer(){clearInterval(timerId);$('timer').classList.add('hidden')}
function renderHistory(){
 $('title').textContent='Прогресс';$('subtitle').textContent='Вес, объём и история тренировок';
 let all=[];data.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>{if(s.weight&&s.reps)all.push({date:w.date,name:e.name,weight:+s.weight,reps:+s.reps,vol:(+s.weight)*(+s.reps)})})));
 let names=[...new Set(all.map(x=>x.name))];
 $('app').innerHTML=`<div class="card"><div class="grid"><div class="stat"><span class="muted">Тренировок</span><b>${data.workouts.length}</b></div><div class="stat"><span class="muted">Общий объём</span><b>${Math.round(all.reduce((a,x)=>a+x.vol,0))} кг</b></div></div></div>
 <div class="card"><div class="row between"><h3 style="margin:0">Прогресс</h3><select id="sel" onchange="draw()">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div>${names.length?'<canvas id="chart" width="700" height="380"></canvas>':'<p class="muted">Здесь появится график после первой тренировки.</p>'}</div>
 <div class="card"><h3>История</h3>${data.workouts.slice().reverse().map(w=>`<div class="exercise"><b>${new Date(w.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</b><div class="muted" style="margin-top:6px">${w.exercises.map(e=>`${esc(e.name)} — ${e.sets.map(s=>`${s.weight||0}×${s.reps||0}`).join(', ')}`).join('<br>')}</div></div>`).join('')||'<p class="muted">Пока нет тренировок.</p>'}</div>`;
 if(names.length)draw();
}
function draw(){let c=$('chart'),ctx=c.getContext('2d'),name=$('sel').value;let pts=[];data.workouts.forEach(w=>w.exercises.forEach(e=>{if(e.name===name)e.sets.forEach(s=>{if(s.weight)pts.push({x:new Date(w.date),y:+s.weight})})}));ctx.clearRect(0,0,c.width,c.height);if(!pts.length)return;let min=Math.min(...pts.map(p=>p.y)),max=Math.max(...pts.map(p=>p.y));if(min===max){min-=1;max+=1}let pad=45;ctx.strokeStyle='#343944';ctx.beginPath();ctx.moveTo(pad,20);ctx.lineTo(pad,c.height-pad);ctx.lineTo(c.width-15,c.height-pad);ctx.stroke();ctx.strokeStyle='#7c5cff';ctx.lineWidth=4;ctx.beginPath();pts.forEach((p,i)=>{let x=pad+(i/(Math.max(1,pts.length-1)))*(c.width-pad-20),y=20+(max-p.y)/(max-min)*(c.height-pad-30);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 20px -apple-system';ctx.fillText(`${max} кг`,pad,18)}
renderTrain();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body></html>
